<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07121d" />
    <meta
      name="description"
      content="tienOS is a personal web desktop for projects, experiments, and ideas."
    />
    <link rel="canonical" href="https://hxutixnnn.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>tienOS</title>
  </head>
  <body>
    <div id="root">
      <main aria-label="tienOS desktop" class="relative min-h-screen overflow-hidden bg-slate-950 text-white">
        <div class="tienos-wallpaper" aria-hidden="true"></div>
        <div class="tienos-vignette" aria-hidden="true"></div>
        <h1 class="sr-only">tienOS desktop</h1>
        <header
          class="fixed inset-x-0 top-0 z-40 flex items-center px-2 pt-[env(safe-area-inset-top)] sm:px-3"
        >
          <nav aria-label="tienOS menu bar" class="tienos-menubar flex h-9 flex-1 items-center gap-0.5">
            <span class="tienos-menu-trigger rounded-full px-2 py-0.5 text-base leading-none">✦</span>
            <span class="tienos-menu-trigger rounded-full px-2 py-0.5 font-medium">Navigator</span>
          </nav>
          <div class="flex items-center gap-2 px-2 text-[13px] font-medium text-white/75">
            <span aria-label="Wi-Fi connected">⌁</span>
            <span aria-label="Battery full">▰</span>
            <span class="whitespace-nowrap">tienOS</span>
          </div>
        </header>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
