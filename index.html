<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07121d" />
    <meta
      name="description"
      content="tienOS is a personal web desktop for projects, experiments, and ideas."
    />
    <link rel="canonical" href="https://hxutixnnn.github.io/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        let mode = "auto";
        try {
          const saved = JSON.parse(localStorage.getItem("tienos-appearance") || "null");
          if (saved === "light" || saved === "dark" || saved === "auto") mode = saved;
        } catch {}
        const theme =
          mode === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.appearance = mode;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#07121d" : "#dbeafe";
        const wallpaper =
          theme === "light" ? "/wallpapers/tienos-light.jpg" : "/wallpapers/tienos-default.jpg";
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = wallpaper;
        document.head.append(preload);
      })();
    </script>
    <style>
      :root {
        --tienos-wallpaper: url("/wallpapers/tienos-default.jpg");
      }
      :root[data-theme="light"] {
        --tienos-wallpaper: url("/wallpapers/tienos-light.jpg");
      }
      #tienos-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #050505;
        color: #fff;
        opacity: 1;
        transition: opacity 160ms ease;
      }
      :root[data-theme="light"] #tienos-boot {
        background: #f8fafc;
        color: #0f172a;
      }
      :root[data-theme="light"] .tienos-boot-track {
        background: rgb(15 23 42 / 0.2);
      }
      :root[data-theme="light"] .tienos-boot-progress {
        background: #0f172a;
      }
      #tienos-boot[data-complete] {
        pointer-events: none;
        opacity: 0;
        animation: none;
      }
      .tienos-boot-content {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 72px;
      }
      .tienos-boot-logo {
        width: 112px;
        height: 112px;
        fill: currentColor;
        filter: drop-shadow(0 8px 32px rgb(255 255 255 / 0.12));
      }
      .tienos-static-icon {
        display: block;
        width: 1em;
        height: 1em;
        fill: currentColor;
      }
      /* Release-safe static shell: remains useful when the application stylesheet/module fails. */
      @layer tienos-fallback {
        html,
        body,
        #root {
          min-height: 100%;
          margin: 0;
          overflow: hidden;
        }
        body {
          min-width: 320px;
          background: #07121d;
          color: #fff;
          font:
            13px/1.4 ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        }
        :root[data-theme="light"] body {
          background: #dbeafe;
          color: #0f172a;
        }
        .tienos-desktop {
          position: relative;
          min-height: 100vh;
          overflow: hidden;
          background: #07121d;
          color: #fff;
        }
        :root[data-theme="light"] .tienos-desktop {
          background: #dbeafe;
          color: #0f172a;
        }
        .tienos-wallpaper,
        .tienos-vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        .tienos-wallpaper {
          background: var(--tienos-wallpaper) center / cover;
        }
        .tienos-vignette {
          background: linear-gradient(180deg, rgb(0 0 0 / 0.35), rgb(0 0 0 / 0.2));
        }
        .tienos-desktop > h1 {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
        }
        .tienos-desktop > header {
          position: fixed;
          z-index: 40;
          top: max(6px, env(safe-area-inset-top));
          right: 6px;
          left: 6px;
          display: flex;
          height: 40px;
          align-items: center;
          padding: 0 8px;
          border: 1px solid rgb(255 255 255 / 0.2);
          border-radius: 14px;
          background: rgb(7 18 29 / 0.72);
          color: rgb(255 255 255 / 0.9);
        }
        .tienos-menubar,
        .tienos-desktop > header > div {
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .tienos-menubar {
          flex: 1;
        }
        .tienos-menu-trigger {
          display: inline-flex;
          align-items: center;
          padding: 2px 8px;
        }
        .tienos-static-dock {
          position: fixed;
          z-index: 45;
          bottom: max(10px, var(--tienos-safe-area-bottom, env(safe-area-inset-bottom)));
          left: 50%;
          display: flex;
          padding: 7px;
          transform: translateX(-50%);
          border: 1px solid rgb(255 255 255 / 0.3);
          border-radius: 20px;
          background: rgb(18 27 39 / 0.78);
          box-shadow: 0 18px 45px rgb(0 0 0 / 0.4);
        }
        :root[data-theme="light"] .tienos-static-dock {
          background: rgb(238 244 251 / 0.82);
        }
        .tienos-static-dock-item {
          position: relative;
          display: flex;
          width: 56px;
          height: 56px;
          align-items: center;
          justify-content: center;
          border: 1px solid rgb(255 255 255 / 0.3);
          border-radius: 14px;
          background: linear-gradient(145deg, #f4f5f7, #aeb4bd);
          color: #30343a;
          box-shadow:
            0 5px 12px rgb(0 0 0 / 0.3),
            inset 0 1px 1px white;
        }
        .tienos-static-dock-item .tienos-static-icon {
          width: 32px;
          height: 32px;
        }
        .tienos-static-dock-indicator {
          position: absolute;
          bottom: -6px;
          left: 50%;
          width: 4px;
          height: 4px;
          transform: translateX(-50%);
          border-radius: 50%;
          background: rgb(255 255 255 / 0.94);
        }
        :root[data-theme="light"] .tienos-static-dock-indicator {
          background: rgb(15 23 42 / 0.86);
        }
        .tienos-visually-hidden {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
      }
      .tienos-boot-track {
        width: min(184px, 52vw);
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.2);
      }
      .tienos-boot-progress {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: #fff;
        transform: scaleX(0);
        transform-origin: left;
        animation: tienos-boot-progress 420ms cubic-bezier(0.22, 0.72, 0.2, 1) forwards;
      }
      @keyframes tienos-boot-progress {
        0% {
          transform: scaleX(0);
        }
        32% {
          transform: scaleX(0.3);
        }
        68% {
          transform: scaleX(0.72);
        }
        100% {
          transform: scaleX(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #tienos-boot {
          transition-duration: 80ms;
        }
        .tienos-boot-progress {
          animation-duration: 120ms;
        }
      }
    </style>
    <noscript>
      <style>
        #tienos-boot {
          animation: tienos-boot-dismiss 160ms ease 420ms forwards;
        }
        @keyframes tienos-boot-dismiss {
          to {
            opacity: 0;
            visibility: hidden;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #tienos-boot {
            animation-delay: 120ms;
            animation-duration: 80ms;
          }
        }
      </style>
    </noscript>
    <script>
      (() => {
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const bootDuration = reducedMotion ? 120 : 420;
        const fadeDuration = reducedMotion ? 80 : 160;
        let finished = false;
        let resolveReleased;
        const released = new Promise((resolve) => {
          resolveReleased = resolve;
        });
        const setDesktopInert = () => {
          const root = document.getElementById("root");
          if (!root) return;
          root.setAttribute("inert", "");
          rootObserver.disconnect();
        };
        const rootObserver = new MutationObserver(setDesktopInert);
        rootObserver.observe(document.documentElement, { childList: true, subtree: true });
        setDesktopInert();

        const releaseDesktop = () => {
          rootObserver.disconnect();
          document.getElementById("root")?.removeAttribute("inert");
          resolveReleased();
        };

        const dismiss = (respectBootDuration) => {
          if (finished) return;
          finished = true;
          window.clearTimeout(startupTimeout);
          window.removeEventListener("error", handleError, true);
          window.removeEventListener("unhandledrejection", release);

          const delay = respectBootDuration ? Math.max(0, bootDuration - performance.now()) : 0;
          window.setTimeout(() => {
            const bootScreen = document.getElementById("tienos-boot");
            if (!bootScreen) {
              releaseDesktop();
              return;
            }
            bootScreen.setAttribute("data-complete", "");
            window.setTimeout(() => {
              bootScreen.remove();
              releaseDesktop();
            }, fadeDuration);
          }, delay);
        };
        const release = () => dismiss(false);
        const handleError = (event) => {
          if (event.target === window || event.target instanceof HTMLScriptElement) release();
        };
        const startupTimeout = window.setTimeout(release, 8000);

        window.addEventListener("error", handleError, true);
        window.addEventListener("unhandledrejection", release);
        window.tienosBoot = {
          failed: release,
          isFinished: () => finished,
          released,
          ready: () => dismiss(true),
        };
      })();
    </script>
    <title>tienOS</title>
  </head>
  <body>
    <div id="tienos-boot" role="status" aria-label="Starting tienOS">
      <div class="tienos-boot-content">
        <svg
          class="tienos-boot-logo"
          viewBox="0 0 512 512"
          aria-hidden="true"
          focusable="false"
          data-boot-icon
        >
          <path
            d="M278.5 15.6C275 6.2 266 0 256 0s-19 6.2-22.5 15.6L174.2 174.2 15.6 233.5C6.2 237 0 246 0 256s6.2 19 15.6 22.5l158.6 59.4 59.4 158.6C237 505.8 246 512 256 512s19-6.2 22.5-15.6l59.4-158.6 158.6-59.4C505.8 275 512 266 512 256s-6.2-19-15.6-22.5L337.8 174.2 278.5 15.6z"
          ></path>
        </svg>
        <div class="tienos-boot-track" aria-hidden="true">
          <div class="tienos-boot-progress"></div>
        </div>
      </div>
    </div>
    <div id="root">
      <main
        aria-label="tienOS desktop"
        class="tienos-desktop relative min-h-screen overflow-hidden bg-[#07121d] text-white [[data-theme=light]_&]:bg-[#dbeafe] [[data-theme=light]_&]:text-[#0f172a]"
      >
        <div
          class="tienos-wallpaper pointer-events-none absolute inset-0 [transform:scale(1.02)] bg-[image:var(--tienos-wallpaper)] bg-cover bg-center saturate-[1.08] motion-safe:animate-[tienos-drift_24s_ease-in-out_infinite_alternate]"
          aria-hidden="true"
        ></div>
        <div
          class="tienos-vignette pointer-events-none absolute inset-0 bg-[linear-gradient(180deg,rgb(0_0_0/0.35)_0%,rgb(0_0_0/0.08)_28%,rgb(0_0_0/0.24)_100%),radial-gradient(circle_at_center,transparent_34%,rgb(0_0_0/0.28)_100%)]"
          aria-hidden="true"
        ></div>
        <h1 class="sr-only">tienOS desktop</h1>
        <header
          data-menu-bar-surface
          class="fixed inset-x-0 top-0 z-40 flex items-center px-2 pt-[env(safe-area-inset-top)] sm:px-3"
        >
          <nav
            aria-label="tienOS menu bar"
            class="tienos-menubar flex h-9 flex-1 items-center gap-0.5 text-[var(--tienos-color-text-on-wallpaper)] [text-shadow:0_1px_3px_rgb(0_0_0/0.4)]"
          >
            <span class="tienos-menu-trigger rounded-full px-2 py-0.5 text-base leading-none">
              <svg class="tienos-static-icon" aria-hidden="true" focusable="false">
                <use href="/fontawesome/fontawesome-pro-solid.svg#fa-sparkle"></use>
              </svg>
            </span>
            <span class="tienos-menu-trigger rounded-full px-2 py-0.5 font-medium">Navigator</span>
          </nav>
          <div class="flex items-center gap-2 px-2 text-[13px] font-medium text-white/75">
            <span role="img" aria-label="Wi-Fi connected">
              <svg class="tienos-static-icon" aria-hidden="true" focusable="false">
                <use href="/fontawesome/fontawesome-pro-solid.svg#fa-wifi"></use>
              </svg>
            </span>
            <span role="img" aria-label="Battery full">
              <svg class="tienos-static-icon" aria-hidden="true" focusable="false">
                <use href="/fontawesome/fontawesome-pro-solid.svg#fa-battery-full"></use>
              </svg>
            </span>
            <span class="whitespace-nowrap">tienOS</span>
          </div>
        </header>
        <aside class="tienos-static-dock" aria-label="Dock preview (non-interactive)">
          <span class="tienos-visually-hidden">
            System Settings is shown running. Launcher controls require JavaScript.
          </span>
          <div class="tienos-static-dock-item" aria-hidden="true">
            <svg class="tienos-static-icon" focusable="false">
              <use href="/fontawesome/fontawesome-pro-solid.svg#fa-gear"></use>
            </svg>
            <span class="tienos-static-dock-indicator"></span>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
